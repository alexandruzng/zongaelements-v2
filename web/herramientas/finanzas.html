/* =========================================================
   AVISOS (notificaciones push)
   El navegador se apunta en push_subs y la función «avisos-suscripciones»
   de Supabase envía los avisos 7, 3 y 1 día antes de cada cobro.
   En iPhone solo funciona con la web añadida a la pantalla de inicio.
   ========================================================= */
const PUSH = {
  ok: "serviceWorker" in navigator && "PushManager" in window && "Notification" in window,
  ios: /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1),
  reg: null
};
if (PUSH.ok && ZE.online) navigator.serviceWorker.register("/sw.js").then(r => PUSH.reg = r).catch(() => {});
const b64u = s => { const b = atob((s + "=".repeat((4 - s.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function pushSub(){ const reg = PUSH.reg || await navigator.serviceWorker.getRegistration("/"); return reg ? reg.pushManager.getSubscription() : null; }
async function pushState(){
  if (!ZE.online || !ZE.user || !ZE.client || !(window.ZE_CONFIG || {}).vapidPublic) return "none";
  if (!PUSH.ok) return PUSH.ios ? "install" : "unsup";
  if (Notification.permission === "denied") return "denied";
  try { return (await pushSub()) ? "on" : "off"; } catch (e) { return "off"; }
}
async function drawPush(){
  const box = $("#pushCard"); if (!box) return;
  const st = await pushState(); if (!$("#pushCard")) return;
  if (st === "none"){ box.innerHTML = ""; return; }
  const pills = `<div class="pills"><span>${t("push.d7")}</span><span>${t("push.d3")}</span><span>${t("push.d1")}</span><span>14:00 </span></div>`;
  const body = st === "install" ? `<h3>${t("push.installT")}</h3><ol>${ta("push.install").map(x => `<li>${esc(x)}</li>`).join("")}</ol>${pills}`
    : st === "unsup" ? `<h3>${t("push.t")}</h3><p>${t("push.unsup")}</p>`
    : st === "denied" ? `<h3>${t("push.t")}</h3><p>${t(PUSH.ios ? "push.denied" : "push.deniedWeb")}</p>`
    : st === "on" ? `<h3>${t("push.on")}</h3><p>${t("push.p")}</p>${pills}<div class="btns"><button class="btn sm yellow" id="pushTest">${t("push.test")}</button><button class="btn sm" id="pushOff">${t("push.off")}</button></div>`
    : `<h3>${t("push.t")}</h3><p>${t("push.p")}</p>${pills}<div class="btns"><button class="btn accent" id="pushOn">${t("push.enable")}</button></div>`;
  box.innerHTML = `<article class="card ${st === "on" ? "c-mint" : "c-sky"} rise"><div class="pushc"><span class="bell">${st === "install" ? SV(CI.phone) : ICON.bell}</span><div class="txt">${body}</div></div></article>`;
  const on = $("#pushOn"), off = $("#pushOff"), test = $("#pushTest");
  if (on) on.addEventListener("click", enablePush);
  if (off) off.addEventListener("click", disablePush);
  if (test) test.addEventListener("click", testPush);
}
async function enablePush(){
  const b = $("#pushOn"); if (b){ b.disabled = true; }
  try {
    // el permiso se pide directamente desde el toque (requisito de iPhone)
    const perm = await Notification.requestPermission();
    if (perm !== "granted"){ drawPush(); return; }
    const reg = PUSH.reg || await navigator.serviceWorker.register("/sw.js"); PUSH.reg = reg;
    await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64u(ZE_CONFIG.vapidPublic) });
    const j = sub.toJSON();
    const { error } = await ZE.client.from("push_subs").upsert({ endpoint:j.endpoint, user_id:ZE.user.id, p256dh:j.keys.p256dh, auth:j.keys.auth, lang, ua:navigator.userAgent.slice(0, 200) });
    if (error) throw error;
    await ZE.flushAll();   // que las suscripciones estén en la nube para la función
    SFX.play("success"); FXC.confetti(); toast(t("push.ok"), "");
    ZE.callFn("avisos-suscripciones", { test:true }).catch(() => {});
  } catch (e){ console.error(e); toast(t("push.err"), ""); }
  drawPush();
}
async function disablePush(){
  try {
    const sub = await pushSub();
    if (sub){ await ZE.client.from("push_subs").delete().eq("endpoint", sub.endpoint); await sub.unsubscribe(); }
    SFX.play("remove"); toast(t("push.disabled"), "");
  } catch (e){ toast(t("push.err"), ""); }
  drawPush();
}
async function testPush(){
  const b = $("#pushTest"); if (b) b.disabled = true;
  try { const r = await ZE.callFn("avisos-suscripciones", { test:true }); const j = await r.json(); toast(t("push.sent", { n:j.sent || 0 }), ""); SFX.play("pop"); }
  catch (e){ toast(t("push.err"), ""); }
  if (b) b.disabled = false;
}

    ${wrappedBanner(view.wrKey)}
    <div class="s12 rise"><span style="font-weight:800;font-size:13px;display:block;margin-bottom:8px">${t("wr.pick")}</span><select class="select" id="wrPick" style="width:min(320px,100%)">${ms.map(k => `<option value="${k}" ${k === view.wrKey ? "selected" : ""}>${esc(monthName(k))}</option>`).join("")}</select></div></div>`;
  $("#wrPick").addEventListener("change", e => { view.wrKey = e.target.value; renderAch(); });

/* ---------- eventos de la página ---------- */
function setMonth(k){ view.key = k; view.all = false; flt.month = k; flt.limit = 40; render(); }
document.addEventListener("click", async e => {
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act === "prev") { SFX.play("tick"); setMonth(shiftKey(view.key, -1)); }
  else if (act === "next") { SFX.play("tick"); setMonth(shiftKey(view.key, 1)); }
  else if (act === "today") { SFX.play("click"); setMonth(keyOf(new Date())); }
  else if (act === "all") { SFX.play("click"); view.all = !view.all; render(); }
  else if (act === "goto") { SFX.play("click"); if (a.dataset.to) view.tab = a.dataset.to; setMonth(a.dataset.k); scrollTo({ top:0, behavior:"smooth" }); }
  else if (act === "edit") openTx(S.tx.find(x => x.id === a.dataset.id));
  else if (act === "more") { flt.limit += 40; updateList(); }
  else if (act === "budgets") openBudgets();
  else if (act === "csv") exportCsv();
  else if (act === "yprev") { view.year--; renderGoals(); }
  else if (act === "ynext") { view.year++; renderGoals(); }
  else if (act === "gnew") openGoal();
  else if (act === "gadd") addToGoal(a.dataset.id);
  else if (act === "snew") openSub(null);
  else if (act === "sedit") openSub(S.subs.find(s => s.id === a.dataset.id));
  else if (act === "wrapped") openWrapped(a.dataset.k);
  else if (act === "import") openImport();
  else if (act === "gdel") {
    const g = S.goals.find(x => x.id === a.dataset.id); if (!g) return;
    if (!await modal({ title:t("g.delT", { g:g.name }), text:t("g.delP"), ok:t("del"), warn:true, danger:true, icon:ICON.trash })) return;
    S.goals = S.goals.filter(x => x !== g); save(); SFX.play("remove"); renderGoals();
  }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.dataset.gin) addToGoal(e.target.dataset.gin); });
document.addEventListener("input", e => { if (e.target.dataset.f !== "q") return; flt.q = e.target.value; flt.limit = 40; updateList(); });
document.addEventListener("change", e => { const f = e.target.dataset.f; if (f !== "cat" && f !== "month") return; flt[f] = e.target.value; updateList(); });
document.addEventListener("click", e => {
  const b = e.target.closest('[data-f="type"]'); if (!b) return;
  flt.type = b.dataset.v; flt.cat = "all"; SFX.play("tick");
  $$('[data-f="type"]').forEach(x => x.classList.toggle("on", x === b));
  $('[data-f="cat"]').innerHTML = catOptions(); updateList();
});

/* ---------- metas ---------- */
function addToGoal(id){
  const g = S.goals.find(x => x.id === id), inp = $(`[data-gin="${id}"]`); if (!g || !inp) return;
  const v = parseNum(inp.value);
  if (!v) return shake(inp);
  const wasDone = g.saved >= g.target;
  g.saved = Math.max(0, Math.round((g.saved + v) * 100) / 100); save();
  if (!wasDone && g.saved >= g.target){ SFX.play("success"); FXC.confetti(); toast(t("g.doneT", { g:g.name }), ""); }
  else { SFX.play("coin"); if (v > 0) FXC.coins(14); toast(t("g.addOk", { a:fmtE(v), g:g.name }), ""); }
  renderGoals();
}
let gColor = COLORS[3];
function swatches(el, cur){ el.innerHTML = COLORS.map(c => `<button class="sw-c ${c === cur ? "on" : ""}" style="--c:${c}" data-c="${c}" aria-label="${c}"></button>`).join(""); }
function openGoal(){
  $("#gName").value = ""; $("#gTarget").value = ""; $("#gSaved").value = ""; $("#gMsg").hidden = true;
  gColor = COLORS[(S.goals.length * 3 + 7) % COLORS.length]; swatches($("#gColors"), gColor);
  openDrawer("drGoal"); setTimeout(() => $("#gName").focus(), 450);
}
$("#gColors").addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (!b) return; gColor = b.dataset.c; $$("#gColors .sw-c").forEach(x => x.classList.toggle("on", x === b)); SFX.play("tick"); });
$("#gCreate").addEventListener("click", () => {
  const name = $("#gName").value.trim(), target = parseNum($("#gTarget").value), saved = parseNum($("#gSaved").value) || 0;
  if (!name || !(target > 0)){ $("#gMsg").textContent = t("g.bad"); $("#gMsg").hidden = false; return shake($("#drGoal .dr-body")); }
  S.goals.push({ id:uid(), name, target:Math.round(target*100)/100, saved:Math.max(0, Math.round(saved*100)/100), color:gColor });
  save(); closeDrawers(); SFX.play("pop"); render();
});

/* =========================================================
   SUSCRIPCIONES
   ========================================================= */
const SF = { id:null, cu:"EUR", f:"m", color:COLORS[0] };
function openSub(s){
  SF.id = s ? s.id : null; SF.cu = s ? s.cu : (pref.get("ze-fin-cur") || "EUR"); SF.f = s ? s.f : "m"; SF.color = s ? s.color : COLORS[(S.subs.length * 3 + 5) % COLORS.length];
  $("#sTitle").textContent = t(s ? "s.edit" : "s.new");
  $("#sName").value = s ? s.name : ""; $("#sAmt").value = s ? String(s.a).replace(".", lang === "en" ? "." : ",") : "";
  $("#sDate").value = s ? nextCharge(s) : addDays(todayIso(), 1);
  $("#sMsg").hidden = true; $("#sDel").hidden = !s;
  const pc = s && prevCharge(s), logged = s && pc && (s.logged || []).includes(pc);
  $("#sLog").hidden = !(s && pc && !logged); $("#sLog").dataset.d = pc || "";
  if (pc) $("#sLog").textContent = "" + t("s.log", { d:dayShort(pc) });
  swatches($("#sColors"), SF.color); paintSub(); openDrawer("drSub");
  if (!s) setTimeout(() => $("#sName").focus(), 450);
}
function paintSub(){
  $$("#sCur button").forEach(b => b.classList.toggle("on", b.dataset.c === SF.cu));
  $$("#sFreq button").forEach(b => b.classList.toggle("on", b.dataset.f === SF.f));
  $("#sHint").textContent = t("s.hint", { f:t("s.h" + SF.f) });
}
$("#sCur").addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (!b) return; SF.cu = b.dataset.c; SFX.play("tick"); paintSub(); });
$("#sFreq").addEventListener("click", e => { const b = e.target.closest("[data-f]"); if (!b) return; SF.f = b.dataset.f; SFX.play("tick"); paintSub(); });
$("#sColors").addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (!b) return; SF.color = b.dataset.c; $$("#sColors .sw-c").forEach(x => x.classList.toggle("on", x === b)); SFX.play("tick"); });
$("#sSave").addEventListener("click", () => {
  const name = $("#sName").value.trim(), a = parseNum($("#sAmt").value), d = $("#sDate").value || todayIso();
  if (!name || !(a > 0)){ $("#sMsg").textContent = t("s.bad"); $("#sMsg").hidden = false; return shake($("#drSub .dr-body")); }
  const rec = { name, a:Math.round(a*100)/100, cu:SF.cu, f:SF.f, d0:d, color:SF.color };
  if (SF.id){
    const s = S.subs.find(x => x.id === SF.id);
    // si no cambian ni la fecha ni la frecuencia, se conserva el primer cobro (y con él, los cobros pasados)
    Object.assign(s, rec, s.f === SF.f && nextCharge(s) === d ? { d0:s.d0 } : {});
  } else S.subs.push({ id:uid(), logged:[], ...rec });
  save(); closeDrawers(); SFX.play("pop"); toast(t("s.saved"), ""); render();
});
$("#sDel").addEventListener("click", async () => {
  const s = S.subs.find(x => x.id === SF.id); if (!s) return;
  if (!await modal({ title:t("s.delT", { s:s.name }), text:t("s.delP"), ok:t("del"), warn:true, danger:true, icon:ICON.trash })) return;
  S.subs = S.subs.filter(x => x !== s); save(); closeDrawers(); SFX.play("remove"); render();
});
$("#sLog").addEventListener("click", () => {
  const s = S.subs.find(x => x.id === SF.id), d = $("#sLog").dataset.d; if (!s || !d) return;
  S.tx.push({ id:uid(), ts:Date.now(), d, t:"exp", c:catOf("suscripciones").id, n:s.name, a:s.a, cu:s.cu, r:FX.rateFor(d) });
  s.logged = [...(s.logged || []), d].slice(-24);
  save(); closeDrawers(); SFX.play("coin"); toast(t("s.logged"), ""); render();
});

const F = { id:null, t:"exp", cu:"EUR", c:null, r:null, d0:null };
function openTx(x){
  F.id = x ? x.id : null; F.t = x ? x.t : (F.t || "exp"); F.cu = x ? x.cu : (pref.get("ze-fin-cur") || "EUR");
  F.c = x ? catOf(x.c).id : null; F.r = x ? x.r : null; F.d0 = x ? x.d : null;
  $("#txTitle").textContent = t(x ? "tx.edit" : "tx.new");
  $("#txAmt").value = x ? String(x.a).replace(".", lang === "en" ? "." : ",") : "";
  $("#txConcept").value = x ? x.n : "";
  $("#txDate").value = x ? x.d : (S.lastDate || todayIso());
  $("#txDel").hidden = !x; $("#txMsg").hidden = true; $("#txNew").hidden = true;
  $("#txAmt").classList.remove("bad"); $("#txConcept").classList.remove("bad");
  paintTx(); openDrawer("drTx");
  if (!x && matchMedia("(pointer: fine)").matches) setTimeout(() => $("#txAmt").focus(), 450);
}
function paintTx(){
  $$("#txType button").forEach(b => b.classList.toggle("on", b.dataset.t === F.t));
  $$("#txCur button").forEach(b => b.classList.toggle("on", b.dataset.c === F.cu));
  $("#txAmtBox").style.setProperty("--tcb", F.t === "inc" ? "var(--mint)" : "var(--salmon)");
  $("#txSave").className = "btn full " + (F.t === "inc" ? "accent" : "danger");
  const cats = catsFor(F.t);
  if (!cats.find(c => c.id === F.c)) F.c = cats[0] && cats[0].id;
  $("#txCats").innerHTML = cats.map(c => `<button class="cp ${c.id === F.c ? "on" : ""}" data-c="${c.id}">${cic(c)}<span>${esc(catName(c))}</span></button>`).join("")
    + `<button class="cp add" data-newcat><span class="plus">${ICON.plus}</span><span>${t("c.addNew")}</span></button>`;
  paintConv();
}
const txRate = () => { const d = $("#txDate").value || todayIso(); return F.id && F.r && d === F.d0 ? F.r : FX.rateFor(d); };   // al editar sin cambiar la fecha se conserva la tasa original
function paintConv(){
  const a = parseNum($("#txAmt").value), r = txRate(), d = $("#txDate").value || todayIso();
  $("#txConv").textContent = a > 0 ? t("tx.conv", { a:F.cu === "EUR" ? fmtR(a*r) : fmtE(a/r), r:fmtRate(r), d:dayShort(d) }) : "";
}
$("#txType").addEventListener("click", e => { const b = e.target.closest("[data-t]"); if (!b) return; F.t = b.dataset.t; $("#txNew").hidden = true; SFX.play("tick"); paintTx(); });
$("#txCur").addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (!b) return; F.cu = b.dataset.c; pref.set("ze-fin-cur", F.cu); SFX.play("tick"); paintTx(); });
const TN = { color:COLORS[5], icon:"cart" };
function paintTN(){

  $("#tnIcons").innerHTML = Object.keys(CI).map(k => `<button class="ic-b ${k === TN.icon ? "on" : ""}" data-v="${k}" aria-label="${k}">${SV(CI[k])}</button>`).join("");

function openTN(){

$("#tnColors").addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (!b) return; TN.color = b.dataset.c; paintTN(); SFX.play("tick"); });
$("#tnIcons").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (!b) return; TN.icon = b.dataset.v; paintTN(); SFX.play("tick"); });
$("#tnCancel").addEventListener("click", () => { $("#txNew").hidden = true; SFX.play("close"); });
$("#tnName").addEventListener("keydown", e => { if (e.key === "Enter") $("#tnCreate").click(); });

$("#txDate").addEventListener("change", paintConv);
$("#txConcept").addEventListener("input", () => $("#txConcept").classList.remove("bad"));
$("#txConcept").addEventListener("keydown", e => { if (e.key === "Enter") $("#txSave").click(); });
$("#txSave").addEventListener("click", () => {
  const a = parseNum($("#txAmt").value), n = $("#txConcept").value.trim(), d = $("#txDate").value || todayIso();
  const err = !(a > 0) ? ["tx.amt0", "#txAmt"] : n.length < 2 ? ["tx.short", "#txConcept"] : null;
  if (err){ $("#txMsg").textContent = t(err[0]); $("#txMsg").hidden = false; $(err[1]).classList.add("bad"); shake($(err[1]).closest(".field") || $(err[1])); return; }

  else S.tx.push({ id:uid(), ts:Date.now(), ...rec });

  if (!F.id && F.t === "inc"){ FXC.coins(); toast(t("tx.savedInc", { a:fmt(a, F.cu) }), ""); } else toast(t("tx.saved"), "");
  if (!F.id && d.slice(0,7) !== view.key && (view.tab === "home" || view.tab === "movs") && !view.all) setMonth(d.slice(0,7)); else render();

$("#txDel").addEventListener("click", async () => {
  const x = S.tx.find(y => y.id === F.id); if (!x) return;
  if (!await modal({ title:t("tx.delT"), text:t("tx.delP", { c:x.n, a:fmtE(eur(x)) }), ok:t("del"), warn:true, danger:true, icon:ICON.trash })) return;

$("#newBtn").addEventListener("click", () => view.tab === "subs" ? openSub(null) : view.tab === "goals" ? openGoal() : openTx(null));

/* =========================================================
   MES RÁPIDO (3 pasos)
   ========================================================= */
const Q = { step:1, key:null, mode:1, type:"exp", n:{ exp:{}, inc:{} }, vals:{} };
function openQuick(){ Q.step = 1; Q.key = view.key; Q.mode = 1; Q.type = "exp"; Q.n = { exp:{}, inc:{} }; Q.vals = {}; drawQuick(); openDrawer("drQuick"); }
const qCount = ty => Object.values(Q.n[ty]).reduce((a, b) => a + b, 0);
const qCls = d => (Q.n.exp[d] ? "he " : "") + (Q.n.inc[d] ? "hi" : "");
const qCell = d => `${d}${Q.n.exp[d] ? `<em class="e">${Q.n.exp[d]}</em>` : ""}${Q.n.inc[d] ? `<em class="i">${Q.n.inc[d]}</em>` : ""}`;
function drawQuick(){
  const steps = [t("q.sDays"), t("q.s3")].map((s, i) => `<div class="qs ${i + 1 === Q.step ? "on" : i + 1 < Q.step ? "done" : ""}"><i></i>${s}</div>`).join("");
  let body = "";
  if (Q.step < 2){
    const n = daysIn(Q.key), { y, m } = parseKey(Q.key), lead = (new Date(y, m-1, 1).getDay() + 6) % 7, isNow = Q.key === keyOf(new Date());
    body = `<div class="mbar" style="margin-bottom:12px"><button class="nav-btn" data-q="mprev">${ICON.prev}</button><div class="mtitle"><h2 style="font-size:26px">${esc(monthName(Q.key))}</h2></div><button class="nav-btn" data-q="mnext">${ICON.next}</button></div>
      <p class="muted" style="margin-bottom:14px">${esc(t("q.pBoth", { m:monthName(Q.key, { month:"long" }) }))}</p>
      <div class="qtype">${["exp","inc"].map(ty => `<button data-q="type" data-v="${ty}" class="${ty} ${Q.type === ty ? "on" : ""}"><i></i>${t(ty === "exp" ? "q.s1" : "q.s2")}<b data-qc="${ty}">${qCount(ty)}</b></button>`).join("")}</div>
      <div class="qmode"><div class="seg-ctl"><button data-q="mode" data-v="1" class="${Q.mode === 1 ? "on" : ""}">+ ${t("q.add")}</button><button data-q="mode" data-v="-1" class="${Q.mode === -1 ? "on" : ""}">− ${t("q.sub")}</button></div></div>
      <div class="cal qcal ${Q.type}">${ta("wd").map(w => `<span class="wd">${w}</span>`).join("")}${"<span></span>".repeat(lead)}
      ${[...Array(n)].map((_, i) => `<button class="cday ${qCls(i+1)} ${isNow && i + 1 === new Date().getDate() ? "today" : ""}" data-q="day" data-d="${i+1}">${qCell(i+1)}</button>`).join("")}</div>`;
  } else {
    const rows = [];
    ["exp","inc"].forEach(type => Object.keys(Q.n[type]).map(Number).forEach(d => { for (let i = 0; i < Q.n[type][d]; i++) rows.push({ type, d, key:`${type}-${d}-${i}` }); }));
    rows.sort((a, b) => a.d - b.d || (a.type === "inc") - (b.type === "inc"));
    if (!rows.length) body = `<div class="empty"><span class="em"></span>${t("q.none")}</div>`;
    else {
      let html = "", last = "";
      rows.forEach(r => {
        const v = Q.vals[r.key] = Q.vals[r.key] || { n:"", c:catsFor(r.type)[0].id, a:"", cu:pref.get("ze-fin-cur") || "EUR" };
        const head = `${r.type}-${r.d}`;
        if (head !== last){ last = head; html += `<div class="qd" style="--tc:${r.type === "inc" ? "var(--green)" : "var(--red)"}"><i></i>${esc(dayLabel(`${Q.key}-${pad(r.d)}`))} · ${t(r.type === "inc" ? "tx.inc" : "tx.exp")}</div>`; }
        html += `<div class="qrow" data-row="${r.key}"><input class="input full" data-k="n" value="${esc(v.n)}" placeholder="${esc(t("tx.concept"))}" maxlength="80" autocomplete="off">
          <select class="select" data-k="c">${catsFor(r.type).map(c => `<option value="${c.id}" ${v.c === c.id ? "selected" : ""}>${esc(catName(c))}</option>`).join("")}</select>
          <div class="ac"><input class="input" data-k="a" value="${esc(v.a)}" inputmode="decimal" placeholder="0,00" autocomplete="off"><div class="seg-ctl">${["EUR","RON"].map(cu => `<button data-q="cu" data-v="${cu}" class="${v.cu === cu ? "on" : ""}">${cu}</button>`).join("")}</div></div></div>`;
      });
      body = `<p class="muted" style="margin-bottom:6px">${t("q.p3")}</p><div class="qrows">${html}</div>`;
    }
  }
  const total = Object.values(Q.n.exp).concat(Object.values(Q.n.inc)).reduce((a, b) => a + b, 0);
  const foot = `<div class="dr-foot" style="flex-direction:row">${Q.step > 1 ? `<button class="btn" data-q="back" style="flex:1">${t("q.back")}</button>` : ""}
    ${Q.step < 2 ? `<button class="btn primary" data-q="next" style="flex:2">${t("q.next")}${ICON.go}</button>` : `<button class="btn accent" data-q="save" style="flex:2" ${total ? "" : "disabled"}>${t("q.saveAll", { n:total })}</button>`}</div>`;
  $("#qBody").innerHTML = `<div class="qsteps">${steps}</div>${body}${foot}`;
}
$("#qBody").addEventListener("click", e => {
  const b = e.target.closest("[data-q]"); if (!b) return;
  const q = b.dataset.q;
  if (q === "day"){
    const type = Q.type, d = +b.dataset.d, c = Math.max(0, Math.min(20, (Q.n[type][d] || 0) + Q.mode));
    if (c) Q.n[type][d] = c; else delete Q.n[type][d];
    SFX.play(Q.mode > 0 ? "tick" : "remove");
    b.classList.toggle("he", !!Q.n.exp[d]); b.classList.toggle("hi", !!Q.n.inc[d]); b.innerHTML = qCell(d);
    $(`[data-qc="${type}"]`, $("#qBody")).textContent = qCount(type);
    return;
  }
  if (q === "type"){
    Q.type = b.dataset.v; SFX.play("tick");
    $$('[data-q="type"]', $("#qBody")).forEach(x => x.classList.toggle("on", x === b));
    const cal = $(".qcal", $("#qBody")); cal.classList.toggle("exp", Q.type === "exp"); cal.classList.toggle("inc", Q.type === "inc");
    return;
  }
  if (q === "mode"){ Q.mode = +b.dataset.v; SFX.play("tick"); }
  else if (q === "mprev" || q === "mnext"){ Q.key = shiftKey(Q.key, q === "mprev" ? -1 : 1); Q.n = { exp:{}, inc:{} }; Q.vals = {}; SFX.play("tick"); }
  else if (q === "next"){ Q.step++; SFX.play("click"); }
  else if (q === "back"){ Q.step--; SFX.play("click"); }
  else if (q === "cu"){ const row = b.closest("[data-row]"); Q.vals[row.dataset.row].cu = b.dataset.v; $$('[data-q="cu"]', row).forEach(x => x.classList.toggle("on", x === b)); SFX.play("tick"); return; }
  else if (q === "save") return saveQuick();
  drawQuick(); $("#drQuick").scrollTop = 0;
});
$("#qBody").addEventListener("input", e => { const row = e.target.closest("[data-row]"); if (!row) return; Q.vals[row.dataset.row][e.target.dataset.k] = e.target.value; e.target.classList.remove("bad"); });
$("#qBody").addEventListener("change", e => { const row = e.target.closest("[data-row]"); if (!row) return; Q.vals[row.dataset.row][e.target.dataset.k] = e.target.value; });
function saveQuick(){
  const out = []; let bad = false;
  $$("#qBody [data-row]").forEach(row => {
    const k = row.dataset.row, v = Q.vals[k], a = parseNum(v.a);
    if (!(a > 0)) return;
    if (v.n.trim().length < 2){ bad = true; $('[data-k="n"]', row).classList.add("bad"); return; }
    const [type, d] = k.split("-"), date = `${Q.key}-${pad(+d)}`;
    out.push({ id:uid(), ts:Date.now(), d:date, t:type, c:v.c, n:v.n.trim(), a:Math.round(a*100)/100, cu:v.cu, r:FX.rateFor(date) });
  });
  if (bad){ toast(t("q.bad"), ""); return shake($("#qBody .qrows")); }
  if (!out.length){ toast(t("q.empty"), ""); return shake($("#qBody .qrows")); }
  S.tx.push(...out); S.flags.quick = true; save(); closeDrawers(); SFX.play("success"); FXC.coins(); toast(t("q.ok", { n:out.length }), "");
  setMonth(Q.key);
}
$("#quickBtn").addEventListener("click", openQuick);

/* =========================================================
   CATEGORÍAS
   ========================================================= */
const CE = { type:"exp", edit:null };
function drawCats(){
  const list = allCats().filter(c => c.type === CE.type || c.type === "both"), ed = CE.edit;
  const editor = ed ? `<div class="cedit" style="--cc:${ed.color}">
      <div class="field"><label for="ceName">${t("c.name")}</label><input class="input" id="ceName" value="${esc(ed.name)}" maxlength="24" autocomplete="off"></div>
      <div class="field"><span class="lab">${t("c.color")}</span><div class="swatches">${COLORS.map(c => `<button class="sw-c ${c === ed.color ? "on" : ""}" style="--c:${c}" data-ce="color" data-v="${c}" aria-label="${c}"></button>`).join("")}</div></div>
      <div class="field"><span class="lab">${t("c.icon")}</span><div class="icons">${Object.keys(CI).map(k => `<button class="ic-b ${k === ed.icon ? "on" : ""}" data-ce="icon" data-v="${k}" aria-label="${k}">${SV(CI[k])}</button>`).join("")}</div></div>
      <div class="cbtns">${ed.id && ed.id !== "otros" ? `<button class="btn" data-ce="del" style="color:var(--red)">${t("del")}</button>` : ""}<button class="btn" data-ce="cancel">${t("cancel")}</button><button class="btn accent" data-ce="save">${t("save")}</button></div></div>` : "";
  $("#cBody").innerHTML = `<div class="seg-ctl" style="margin-bottom:16px">${["exp","inc"].map(v => `<button data-ce="type" data-v="${v}" class="${CE.type === v ? "on" : ""}">${t("f." + v)}</button>`).join("")}</div>
    ${editor}${ed ? "" : `<p class="muted" style="margin-bottom:12px">${t("c.edit")}</p>`}
    <div class="clines">${list.map(c => `<button class="cline" data-ce="open" data-v="${c.id}">${cic(c)}<b>${esc(catName(c))}</b>${c.def ? "" : `<small>${t("c.own")}</small>`}</button>`).join("")}</div>
    <button class="btn primary full" data-ce="new" style="margin-top:14px">${ICON.plus}${t("c.new")}</button>
    <button class="btn full" data-ce="restore" style="margin-top:10px">${t("c.restore")}</button>`;
}
$("#cBody").addEventListener("click", async e => {
  const b = e.target.closest("[data-ce]"); if (!b) return;
  const a = b.dataset.ce, v = b.dataset.v;
  if (a === "type"){ CE.type = v; CE.edit = null; SFX.play("tick"); }
  else if (a === "open"){ const c = catOf(v); CE.edit = { id:c.id, name:catName(c), color:c.color, icon:c.icon }; SFX.play("tick"); }
  else if (a === "new"){ CE.edit = { id:null, name:"", color:COLORS[allCats().length % COLORS.length], icon:CE.type === "inc" ? "trend" : "cart" }; SFX.play("tick"); }
  else if (a === "color" || a === "icon"){ CE.edit.name = $("#ceName").value; CE.edit[a] = v; SFX.play("tick"); }
  else if (a === "cancel"){ CE.edit = null; }
  else if (a === "save"){
    const ed = CE.edit, name = $("#ceName").value.trim();
    if (name.length < 2){ toast(t("c.short"), ""); return shake($("#ceName")); }
    if (!ed.id) S.cats.custom.push({ id:"c_" + uid(), type:CE.type, name, color:ed.color, icon:ed.icon });
    else if (DEF_CATS.find(c => c.id === ed.id)){
      const def = DEF_CATS.find(c => c.id === ed.id), o = {};
      if (name !== T[lang].cats[ed.id]) o.name = name; if (ed.color !== def.color) o.color = ed.color; if (ed.icon !== def.icon) o.icon = ed.icon;
      if (Object.keys(o).length) S.cats.over[ed.id] = o; else delete S.cats.over[ed.id];
    } else Object.assign(S.cats.custom.find(c => c.id === ed.id), { name, color:ed.color, icon:ed.icon });
    CE.edit = null; save(); SFX.play("pop"); toast(t("c.saved"), ""); render();
  }
  else if (a === "del"){
    const c = catOf(CE.edit.id);
    if (!await modal({ title:t("c.delT", { c:catName(c) }), text:t("c.delP"), ok:t("del"), warn:true, danger:true, icon:ICON.trash })) return;
    if (c.def){ S.cats.del.push(c.id); delete S.cats.over[c.id]; } else S.cats.custom = S.cats.custom.filter(x => x.id !== c.id);
    delete S.budgets[c.id]; CE.edit = null; save(); SFX.play("remove"); toast(t("c.deleted"), ""); render();
  }
  else if (a === "restore"){
    if (!await modal({ title:t("c.restoreT"), text:t("c.restoreP"), ok:t("c.restore"), icon:ICON.check })) return;
    S.cats.over = {}; S.cats.del = []; CE.edit = null; save(); SFX.play("pop"); toast(t("c.restored"), ""); render();
  }
  drawCats();
});
function openCats(){ CE.edit = null; drawCats(); openDrawer("drCats"); }

function openBudgets(){
  $("#bList").innerHTML = catsFor("exp").map(c => `<div class="cline">${cic(c)}<b>${esc(catName(c))}</b><span class="bin"><input class="input" inputmode="decimal" data-b="${c.id}" value="${S.budgets[c.id] || ""}" placeholder="—" autocomplete="off"><span>€</span></span></div>`).join("");
  openDrawer("drBud");
}
$("#bSave").addEventListener("click", () => {
  const b = {};
  $$("#bList [data-b]").forEach(inp => { const v = parseNum(inp.value); if (v > 0) b[inp.dataset.b] = Math.round(v*100)/100; });
  S.budgets = b; save(); closeDrawers(); SFX.play("pop"); toast(t("b.saved"), ""); render();
});
function download(blob, name){
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function exportCsv(){
  if (!S.tx.length) return toast(t("csvNone"), "");
  const sep = lang === "en" ? "," : ";", dec = v => { const s = v.toFixed(2); return lang === "en" ? s : s.replace(".", ","); };
  const q = s => `"${String(s).replace(/"/g, '""')}"`;
  const rows = S.tx.slice().sort((a, b) => a.d.localeCompare(b.d)).map(x => [x.d, t(x.t === "inc" ? "tx.inc" : "tx.exp"), catName(catOf(x.c)), x.n, (x.t === "inc" ? "" : "-") + dec(eur(x)), (x.t === "inc" ? "" : "-") + dec(ron(x)), lang === "en" ? x.r.toFixed(4) : x.r.toFixed(4).replace(".", ",")].map(q).join(sep));
  download(new Blob(["﻿" + [ta("csvH").map(q).join(sep), ...rows].join("\r\n")], { type:"text/csv;charset=utf-8" }), `finanzas-${todayIso()}.csv`);
  SFX.play("pop"); toast(t("csvOk"), "");
}
function paintWhims(){
  $("#setWhims").innerHTML = catsFor("exp").filter(c => c.id !== "otros").map(c => `<button class="chip ${S.settings.whims.includes(c.id) ? "on" : ""}" data-w="${c.id}">${esc(catName(c))}</button>`).join("");
}
$("#setWhims").addEventListener("click", e => {
  const b = e.target.closest("[data-w]"); if (!b) return;
  const id = b.dataset.w, w = new Set(S.settings.whims); w.has(id) ? w.delete(id) : w.add(id);
  S.settings.whims = [...w]; save(); SFX.play("tick"); paintWhims(); render();
});
$("#btnSettings").addEventListener("click", () => {
  $("#setSound").checked = S.settings.sound; $("#setName").value = S.settings.name || "";
  $$("#setLang button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));

$("#setName").addEventListener("change", e => { S.settings.name = e.target.value.trim(); save(); render(); });
$("#setSound").addEventListener("change", e => { S.settings.sound = e.target.checked; save(); SFX.play("pop"); });

/* =========================================================
   IMPORTAR COPIA DE LA WEB ANTIGUA (Zonga Elements)
   La copia es { app, data:{ "fz:transactions": "LZ1:…", … } }: cada valor va
   comprimido con lz-string (compressToEncodedURIComponent) o en JSON normal.
   Solo se leen las claves de Finanzas y del gestor de suscripciones.
   ========================================================= */
let LZ = null;
const loadLZ = () => LZ ? Promise.resolve(LZ) : new Promise((res, rej) => {
  const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js";
  sc.onload = () => res(LZ = window.LZString); sc.onerror = rej; document.head.appendChild(sc);
});
const OLD_CATS = { food:"comida", transport:"transporte", home:"hogar", leisure:"ocio", health:"salud", shopping:"compras", subs:"suscripciones", other:"otros", salary:"sueldo", freelance:"freelance", gift:"regalo" };
const OLD_ICONS = { utensils:"food", bag:"bag", wallet:"wallet", laptop:"laptop", heart:"heart", bell:"bell", repeat:"repeat", sparkles:"sparkles", car:"car", home:"home", gift:"gift", briefcase:"briefcase", plane:"plane", coffee:"coffee", book:"book", phone:"phone", dumbbell:"dumbbell", zap:"zap", cart:"cart", music:"music", gamepad:"gamepad", shirt:"shirt", ticket:"ticket", film:"ticket", trend:"trend", store:"store", megaphone:"megaphone" };
let IMP = null;
function openImport(){ IMP = null; $("#impRes").innerHTML = ""; $("#impFile").value = ""; $("#impDrop").classList.remove("busy"); openDrawer("drImp"); }
function readKey(data, k){
  const v = data[k]; if (v == null) return null;
  if (typeof v !== "string") return v;
  if (v.startsWith("LZ1:")){
    const raw = v.slice(4);
    for (const f of ["decompressFromEncodedURIComponent", "decompressFromBase64", "decompressFromUTF16", "decompress"]){
      try { const r = LZ[f](raw); if (r) return JSON.parse(r); } catch (e) {}
    }
    return null;
  }
  try { return JSON.parse(v); } catch (e) { return v; }
}
async function parseBackup(file){
  const box = $("#impRes"); $("#impDrop").classList.add("busy");
  box.innerHTML = `<div class="empty"><span class="em"></span>${t("imp.reading")}</div>`;
  try {
    const json = JSON.parse(await file.text()), data = json && (json.data || json);
    if (!data || !data["fz:transactions"]) throw "bad";
    await loadLZ();
    const tx = readKey(data, "fz:transactions"), cats = readKey(data, "fz:categories") || [], over = readKey(data, "fz:categoryOverrides") || {}, subs = readKey(data, "suscrito.v1") || [];
    if (!Array.isArray(tx)) throw "bad";
    const have = new Set(S.tx.map(x => x.id)), haveSubs = new Set(S.subs.map(x => x.id)), haveCats = new Set(allCats().map(c => c.id));
    const custom = cats.filter(c => c && c.custom && c.key);
    const newTx = tx.filter(x => x && x.date && x.amount > 0 && !have.has("imp-" + x.id));
    const active = subs.filter(x => x && x.status !== "cancelada" && x.amount > 0);
    IMP = { tx:newTx, dup:tx.length - newTx.length, cats:custom.filter(c => !haveCats.has("c_" + c.key)), over, subs:active.filter(x => !haveSubs.has("imp-" + x.id)), cancelled:subs.length - active.length };
    drawImport(tx);
  } catch (e){
    box.innerHTML = `<div class="tip warn" style="margin-top:16px"><span class="ti"></span><span>${e === "bad" ? t("imp.bad") : t("imp.err")}</span></div>`;
  }
  $("#impDrop").classList.remove("busy");
}

async function runImport(){

function wrappedData(k){

  const perDay = {}; list.filter(x => x.t === "exp").forEach(x => perDay[x.d] = (perDay[x.d] || 0) + eur(x));
  const topDay = Object.entries(perDay).sort((a, b) => b[1] - a[1])[0];
  const big = list.filter(x => x.t === "exp").sort((a, b) => eur(b) - eur(a))[0];

    cc.style.setProperty("--ang", `${200 + nx * 120}deg`); cc.style.setProperty("--sx", `${nx * 120}%`);
  }); }, { passive:true });
}
/* etiqueta flotante: cualquier elemento con data-tip; en el donut además resalta el trozo y cambia el centro */
const TIP = document.createElement("div"); TIP.className = "ftip"; document.body.appendChild(TIP);
let tipEl = null;
function showTip(el, x, y){
  if (tipEl !== el){ tipEl = el; TIP.textContent = el.dataset.tip; TIP.classList.remove("on"); void TIP.offsetWidth; TIP.classList.add("on"); }
  const w = TIP.offsetWidth; TIP.style.left = Math.min(innerWidth - w - 8, Math.max(8, x - w / 2)) + "px"; TIP.style.top = (y - 44) + "px";
  const card = el.closest(".dcard");
  if (card && el.dataset.ci != null){
    card.classList.add("hov"); $$("[data-ci]", card).forEach(e => e.classList.toggle("hl", e.dataset.ci === el.dataset.ci));
    const seg = $(`circle[data-ci="${el.dataset.ci}"]`, card), [nm, am, pc] = el.dataset.tip.split(" · ");
    $(".ctr", card).innerHTML = `<span class="pop">${esc(nm)}</span><b class="num pop">${esc(am)}</b><em class="pop">${esc(pc || "")}</em>`;
    if (seg) $(".ctr", card).style.setProperty("--sc", seg.getAttribute("stroke"));
  }
}
function hideTip(){
  if (!tipEl) return;
  const card = tipEl.closest(".dcard");
  if (card){ card.classList.remove("hov"); $$(".hl", card).forEach(e => e.classList.remove("hl")); const c = $(".ctr", card); c.innerHTML = `<span>${t("total")}</span><b class="num">${c.dataset.tot}</b>`; }
  tipEl = null; TIP.classList.remove("on");
}
document.addEventListener("pointermove", e => { const el = e.target.closest && e.target.closest("[data-tip]"); if (el) showTip(el, e.clientX, e.clientY); else hideTip(); }, { passive:true });
document.addEventListener("pointerdown", e => { if (e.pointerType === "mouse") return; const el = e.target.closest && e.target.closest("[data-tip]"); if (el) showTip(el, e.clientX, e.clientY); else hideTip(); }, { passive:true });
addEventListener("scroll", hideTip, { passive:true });
FX.onChange = () => { const lb = FX.label(); $("#fxTxt").textContent = lb.txt; $("#fxPill").className = "fx " + lb.cls; if ($("#drTx").classList.contains("on")) paintConv(); };
checkAch(firstAch);   // con datos de antes de los logros, se desbloquean sin avisos
if (firstAch && S.tx.length) DB.save(S);
setTimeout(() => ZN.popup({ newsUrl: "../#novedades" }), 1200);
try { ZE.mountAccount($(".controls")); } catch (e) {}
if (location.hash === "#subs") view.tab = "subs";
addEventListener("hashchange", () => { if (location.hash === "#subs" && view.tab !== "subs"){ view.tab = "subs"; render(); } });
applyLang(lang);
FX.load();
})();
