      <p class="muted" style="margin-bottom:14px">${esc(t(Q.step === 1 ? "q.p1" : "q.p2", { m:monthName(Q.key, { month:"long" }) }))}</p>
      <div class="qmode"><div class="seg-ctl"><button data-q="mode" data-v="1" class="${Q.mode === 1 ? "on" : ""}">+ ${t("q.add")}</button><button data-q="mode" data-v="-1" class="${Q.mode === -1 ? "on" : ""}">− ${t("q.sub")}</button></div><span class="qcount">${t("q.count", { n:cnt })}</span></div>
      <div class="cal" style="--tc:${type === "inc" ? "var(--inc)" : "var(--exp)"}">${ta("wd").map(w => `<span class="wd">${w}</span>`).join("")}${"<span></span>".repeat(lead)}
      ${[...Array(n)].map((_, i) => { const c = Q.n[type][i+1] || 0; return `<button class="cday ${c ? "has" : ""} ${isNow && i + 1 === new Date().getDate() ? "today" : ""}" data-q="day" data-d="${i+1}">${i+1}${c ? `<em>${c}</em>` : ""}</button>`; }).join("")}</div>`;
  } else {
    const rows = [];
    ["exp","inc"].forEach(type => Object.keys(Q.n[type]).map(Number).sort((a, b) => a - b).forEach(d => { for (let i = 0; i < Q.n[type][d]; i++) rows.push({ type, d, key:`${type}-${d}-${i}` }); }));

        const head = `${r.type}-${r.d}`;

        html += `<div class="qrow" data-row="${r.key}"><input class="input full" data-k="n" value="${esc(v.n)}" placeholder="${esc(t("tx.concept"))}" maxlength="80" autocomplete="off">
          <select class="select" data-k="c">${catsFor(r.type).map(c => `<option value="${c.id}" ${v.c === c.id ? "selected" : ""}>${esc(catName(c))}</option>`).join("")}</select>
          <div class="ac"><input class="input" data-k="a" value="${esc(v.a)}" inputmode="decimal" placeholder="0,00" autocomplete="off"><div class="seg-ctl">${["EUR","RON"].map(cu => `<button data-q="cu" data-v="${cu}" class="${v.cu === cu ? "on" : ""}">${cu}</button>`).join("")}</div></div></div>`;
      });
      body = `<p class="muted" style="margin-bottom:6px">${t("q.p3")}</p><div class="qrows">${html}</div>`;

    ${Q.step < 3 ? `<button class="btn primary" data-q="next" style="flex:2">${t("q.next")}${ICON.go}</button>` : `<button class="btn accent" data-q="save" style="flex:2" ${total ? "" : "disabled"}>${t("q.saveAll", { n:total })}</button>`}</div>`;

function applyLang(l){
  lang = T[l] ? l : "es"; pref.set("ze-lang", lang); document.documentElement.lang = lang;
  document.title = `${t("tool")} · ZongaElements`;
  $$("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  $$("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  $$("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  $$("[data-i18n-title]").forEach(el => el.title = t(el.dataset.i18nTitle));
  render();
  if ($("#drTx").classList.contains("on")) paintTx();
  if ($("#drQuick").classList.contains("on")) drawQuick();
}
const root = document.documentElement;
root.dataset.theme = pref.get("ze-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
$("#themeBtn").addEventListener("click", () => { root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark"; pref.set("ze-theme", root.dataset.theme); SFX.play("click"); });
addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (modalRes) return modalRes(false);
  closeDrawers();
});

/* =========================================================
   ARRANQUE
   ========================================================= */
/* las cifras guardan su propia tasa: al llegar la de hoy solo cambian la etiqueta, las metas y la conversión del formulario */
FX.onChange = () => { const lb = FX.label(); $("#fxTxt").textContent = lb.txt; $("#fxPill").className = "fx " + lb.cls; if (view.tab === "goals" && !$(".drawer.on")) renderGoals(); if ($("#drTx").classList.contains("on")) paintConv(); };
setTimeout(() => ZN.popup({ newsUrl: "../#novedades" }), 1200);
try { ZE.mountAccount($(".controls")); } catch (e) {}
applyLang(lang);
FX.load();
document.fonts && document.fonts.ready.then(movePill);
})();
</script>
</body>
