# En el plan gratis, Supabase pausa el proyecto tras 7 días sin actividad.
# Esta tarea le hace una consulta mínima cada día para que nunca se pause.
# Ojo: GitHub desactiva las tareas programadas si el repositorio pasa 60 días
# sin cambios; cualquier publicación nueva las mantiene activas.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 6 * * *"   # todos los días a las 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta a la base de datos
        run: |
          curl -fsS -X POST "https://kzlhjyvayrrqvviczhlo.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_Y6zUE8n6KkLLqiyTs5yLEw_U48_q00d" \
            -H "Content-Type: application/json" \
            -d '{}'
